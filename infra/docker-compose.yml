services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: actiongate
      POSTGRES_PASSWORD: actiongate
      POSTGRES_DB: actiongate
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["actiongate-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actiongate"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["actiongate-redis:/data"]
  api:
    build: { context: "..", dockerfile: Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://actiongate:actiongate@postgres:5432/actiongate
      REDIS_URL: redis://redis:6379
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  web:
    build: { context: "..", dockerfile: Dockerfile }
    command: ["pnpm", "dev:web"]
    env_file: ../.env
    environment:
      API_URL: http://api:8080
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  actiongate-postgres:
  actiongate-redis:
