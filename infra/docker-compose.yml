services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: actiongate
      POSTGRES_PASSWORD: actiongate
      POSTGRES_DB: actiongate
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["actiongate-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actiongate"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:8-alpine
    ports: ["${REDIS_PORT:-6379}:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["actiongate-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: { context: "..", dockerfile: Dockerfile }
    command: ["./node_modules/.bin/drizzle-kit", "migrate"]
    environment:
      DATABASE_URL: postgres://actiongate:actiongate@postgres:5432/actiongate
    depends_on:
      postgres: { condition: service_healthy }
  seed:
    build: { context: "..", dockerfile: Dockerfile }
    command: ["./node_modules/.bin/tsx", "scripts/seed.ts"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://actiongate:actiongate@postgres:5432/actiongate
    depends_on:
      migrate: { condition: service_completed_successfully }
  api:
    build: { context: "..", dockerfile: Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://actiongate:actiongate@postgres:5432/actiongate
      REDIS_URL: redis://redis:6379
      ACTIONGATE_STORAGE: redis
      ACTIONGATE_CONTROL_PLANE: postgres
    ports: ["8080:8080"]
    depends_on:
      redis: { condition: service_healthy }
      seed: { condition: service_completed_successfully }
  web:
    build: { context: "..", dockerfile: Dockerfile }
    working_dir: /app/apps/web
    command: ["./node_modules/.bin/next", "dev"]
    env_file: ../.env
    environment:
      API_URL: http://api:8080
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  actiongate-postgres:
  actiongate-redis:
