[project]
name = "actiongate"
version = "0.1.0"
description = "Python client for ActionGate: authorize, consume a single-use grant, then call a private handler."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Omkar Ghugarkar" }]
keywords = ["ai-agents", "agent-security", "authorization", "guardrails", "jev"]
dependencies = []

[project.urls]
Homepage = "https://github.com/omkarghugarkar007/actiongate-jev"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/actiongate"]
