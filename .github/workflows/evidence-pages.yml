name: Recorded evidence walkthrough

on:
  push:
    branches: [main]
    paths:
      - 'demos/nvidia-nebius/workbench/**'
      - 'demos/nvidia-nebius/verification/nebius-workbench-*.json'
      - 'demos/nvidia-nebius/src/recording.ts'
      - 'scripts/build-nebius-workbench.ts'
      - '.github/workflows/evidence-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: evidence-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.27.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm hackathon:workbench:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: demos/nvidia-nebius/submission/dist/workbench
      - name: Publish static evidence
        id: deployment
        uses: actions/deploy-pages@v5
