name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: actiongate
          POSTGRES_PASSWORD: actiongate
          POSTGRES_DB: actiongate
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U actiongate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10.27.0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm test:redis
      - run: pnpm db:migrate
      - run: pnpm test:postgres
      - run: pnpm build
      - run: pnpm manifests:validate
      - run: pnpm build:packages
      - run: pnpm packages:check
      - name: API description is in step with the server
        run: |
          pnpm api:generate
          pnpm client:generate
          git diff --exit-code docs/api/openapi.json packages/sdk-js/src/generated/client.ts
      - run: pnpm sbom
      - run: pnpm audit --prod
