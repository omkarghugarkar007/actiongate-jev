<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">ActionGate — runtime authorization for AI agent actions</title>
  <desc id="desc">A dark technical banner showing an AI agent action passing through deterministic rules and TypeSafe Jev to an allow, review, or block decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080b10"/>
      <stop offset="0.55" stop-color="#101724"/>
      <stop offset="1" stop-color="#0a0d13"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.25" r="0.65">
      <stop offset="0" stop-color="#536dfe" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#536dfe" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="28" fill="url(#glow)"/>
  <g opacity="0.12" stroke="#8b98b3" stroke-width="1">
    <path d="M0 80H1280M0 160H1280M0 240H1280M0 320H1280M0 400H1280M0 480H1280M0 560H1280"/>
    <path d="M80 0V640M160 0V640M240 0V640M320 0V640M400 0V640M480 0V640M560 0V640M640 0V640M720 0V640M800 0V640M880 0V640M960 0V640M1040 0V640M1120 0V640M1200 0V640"/>
  </g>
  <g transform="translate(88 80)">
    <g transform="translate(0 1)">
      <rect width="54" height="54" rx="15" fill="#1a2231" stroke="#5269ff" stroke-width="2"/>
      <path d="M27 10l14 6v10c0 10-5.8 17.2-14 21-8.2-3.8-14-11-14-21V16l14-6z" fill="none" stroke="#7e90ff" stroke-width="3"/>
      <path d="M20 27l5 5 10-11" fill="none" stroke="#67e2aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="76" y="40" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="750" letter-spacing="-1">ActionGate</text>
    <text x="0" y="146" fill="#f4f7fb" font-family="Inter, ui-sans-serif, system-ui" font-size="64" font-weight="760" letter-spacing="-2.5">Authorization before action.</text>
    <text x="0" y="203" fill="#98a4b8" font-family="Inter, ui-sans-serif, system-ui" font-size="25">Runtime guardrails for AI-agent tool calls with</text>
    <text x="0" y="238" fill="#98a4b8" font-family="Inter, ui-sans-serif, system-ui" font-size="25">deterministic policy + TypeSafe Jev, direct or via OpenRouter.</text>
    <g transform="translate(0 300)" filter="url(#shadow)">
      <rect width="176" height="58" rx="12" fill="#151b25" stroke="#2b3546"/>
      <text x="88" y="37" text-anchor="middle" fill="#dfe5ef" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="650">PROPOSED ACTION</text>
      <path d="M188 29h58" stroke="#465269" stroke-width="2"/>
      <path d="M239 22l9 7-9 7" fill="none" stroke="#465269" stroke-width="2"/>
      <rect x="260" width="190" height="58" rx="12" fill="#151b25" stroke="#2b3546"/>
      <text x="355" y="37" text-anchor="middle" fill="#dfe5ef" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="650">RULES + JEV</text>
      <path d="M462 29h58" stroke="#465269" stroke-width="2"/>
      <path d="M513 22l9 7-9 7" fill="none" stroke="#465269" stroke-width="2"/>
      <rect x="534" width="130" height="58" rx="12" fill="#12291f" stroke="#38b77e"/>
      <text x="599" y="37" text-anchor="middle" fill="#67e2aa" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="750">ALLOW</text>
      <rect x="678" width="130" height="58" rx="12" fill="#302816" stroke="#bf9234"/>
      <text x="743" y="37" text-anchor="middle" fill="#ffd070" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="750">REVIEW</text>
      <rect x="822" width="130" height="58" rx="12" fill="#321b1d" stroke="#c65359"/>
      <text x="887" y="37" text-anchor="middle" fill="#ff8589" font-family="Inter, ui-sans-serif, system-ui" font-size="17" font-weight="750">BLOCK</text>
    </g>
    <g transform="translate(0 427)">
      <rect width="194" height="40" rx="20" fill="#151c28" stroke="#29364e"/>
      <circle cx="21" cy="20" r="5" fill="#67e2aa"/>
      <text x="36" y="26" fill="#aeb9ca" font-family="Inter, ui-sans-serif, system-ui" font-size="15">TypeScript monorepo</text>
      <rect x="208" width="172" height="40" rx="20" fill="#151c28" stroke="#29364e"/>
      <circle cx="229" cy="20" r="5" fill="#7e90ff"/>
      <text x="244" y="26" fill="#aeb9ca" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Shadow mode first</text>
      <rect x="394" width="166" height="40" rx="20" fill="#151c28" stroke="#29364e"/>
      <circle cx="415" cy="20" r="5" fill="#ffd070"/>
      <text x="430" y="26" fill="#aeb9ca" font-family="Inter, ui-sans-serif, system-ui" font-size="15">Auditable decisions</text>
    </g>
  </g>
</svg>
