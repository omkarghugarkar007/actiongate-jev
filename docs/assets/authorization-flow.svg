<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-labelledby="title description" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <title id="title">ActionGate authorization flow</title>
  <desc id="description">A user request and an AI agent proposed action enter ActionGate. ActionGate checks hard rules and semantic alignment, then returns allow, review, or block. Only an allowed action may proceed.</desc>
  <rect width="980" height="430" fill="#fbfbfd"/>
  <style>
    .heading { font-size:20px; font-weight:650; fill:#15213b }
    .subheading { font-size:12px; fill:#667085 }
    .label { font-size:11px; font-weight:650; fill:#667085; letter-spacing:.08em }
    .title { font-size:14px; font-weight:650; fill:#15213b }
    .body { font-size:12px; fill:#667085 }
    .small { font-size:11px; fill:#667085 }
    .card { fill:#fff; stroke:#d7dce6; stroke-width:1.3 }
    .gate { fill:#eef3ff; stroke:#6f83d8; stroke-width:1.5 }
    .rule { fill:#fff8ec; stroke:#dba84b; stroke-width:1.3 }
    .meaning { fill:#f1efff; stroke:#9482d6; stroke-width:1.3 }
    .allow { fill:#eef9f2; stroke:#66a77a; stroke-width:1.3 }
    .review { fill:#fff8ec; stroke:#dba84b; stroke-width:1.3 }
    .block { fill:#fff0f1; stroke:#d87980; stroke-width:1.3 }
    .arrow { stroke:#9aa4b2; stroke-width:1.6; fill:none; marker-end:url(#arrow) }
    .line { stroke:#c5cbd5; stroke-width:1.3; fill:none }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa4b2"/>
    </marker>
  </defs>

  <text x="36" y="40" class="heading">From user intent to an authorized action</text>
  <text x="36" y="62" class="subheading">The agent can propose an action. It cannot approve its own action.</text>

  <text x="36" y="104" class="label">CONTEXT</text>
  <rect x="36" y="118" width="188" height="88" rx="10" class="card"/>
  <circle cx="66" cy="149" r="13" fill="#eef3ff" stroke="#6f83d8"/>
  <path d="M60 149 h12 M66 143 v12" stroke="#6f83d8" stroke-width="1.5"/>
  <text x="90" y="149" class="title">User request</text>
  <text x="56" y="178" class="body">What the person wants</text>
  <text x="56" y="194" class="body">to happen</text>

  <rect x="36" y="224" width="188" height="88" rx="10" class="card"/>
  <circle cx="66" cy="255" r="13" fill="#f1efff" stroke="#9482d6"/>
  <path d="M60 251 h12 v9 h-12 z M63 247 h6" fill="none" stroke="#9482d6" stroke-width="1.4"/>
  <text x="90" y="255" class="title">Proposed action</text>
  <text x="56" y="284" class="body">What the agent plans</text>
  <text x="56" y="300" class="body">to do next</text>

  <path d="M228 162 H284" class="arrow"/>
  <path d="M228 268 H258 V162 H284" class="arrow"/>

  <text x="288" y="104" class="label">AUTHORIZATION GATE</text>
  <rect x="288" y="118" width="330" height="194" rx="14" class="gate"/>
  <text x="453" y="148" class="title" text-anchor="middle">Does this action match the request</text>
  <text x="453" y="168" class="title" text-anchor="middle">and satisfy every safety rule?</text>

  <rect x="310" y="190" width="137" height="92" rx="9" class="rule"/>
  <text x="378.5" y="216" class="title" text-anchor="middle">Hard rules</text>
  <text x="378.5" y="238" class="body" text-anchor="middle">Identity · permission</text>
  <text x="378.5" y="256" class="body" text-anchor="middle">limits · duplicates</text>

  <rect x="459" y="190" width="137" height="92" rx="9" class="meaning"/>
  <text x="527.5" y="216" class="title" text-anchor="middle">Meaning</text>
  <text x="527.5" y="238" class="body" text-anchor="middle">Intent · target</text>
  <text x="527.5" y="256" class="body" text-anchor="middle">scope · exposure</text>

  <path d="M622 215 H650" class="line"/>
  <path d="M650 215 V149 H678" class="arrow"/>
  <path d="M650 221 H678" class="arrow"/>
  <path d="M650 215 V293 H678" class="arrow"/>
  <text x="680" y="104" class="label">DECISION</text>

  <rect x="680" y="118" width="264" height="62" rx="10" class="allow"/>
  <circle cx="710" cy="149" r="13" fill="#66a77a"/>
  <path d="M704 149 l4 4 8-9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="734" y="145" class="title">ALLOW</text>
  <text x="734" y="162" class="body">The action may proceed</text>

  <rect x="680" y="190" width="264" height="62" rx="10" class="review"/>
  <circle cx="710" cy="221" r="13" fill="#dba84b"/>
  <path d="M710 211 v12 M710 228 v1" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="734" y="217" class="title">REVIEW</text>
  <text x="734" y="234" class="body">A person should confirm</text>

  <rect x="680" y="262" width="264" height="62" rx="10" class="block"/>
  <circle cx="710" cy="293" r="13" fill="#d87980"/>
  <path d="M704 287 l12 12 M716 287 l-12 12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="734" y="289" class="title">BLOCK</text>
  <text x="734" y="306" class="body">The action must not execute</text>

  <rect x="288" y="354" width="656" height="46" rx="9" fill="#fff" stroke="#d7dce6" stroke-width="1.2"/>
  <text x="616" y="374" class="title" text-anchor="middle">Authorization is separate from execution</text>
  <text x="616" y="390" class="small" text-anchor="middle">ActionGate decides. The application keeps credentials and performs approved actions.</text>
</svg>
