<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-labelledby="title description" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <title id="title">ActionGate permit lifecycle</title>
  <desc id="description">An agent proposes an action. ActionGate checks deterministic policy and semantic evidence. An allowed action receives a short-lived permit bound to that exact action. The executor consumes the permit once before the tool runs. Review and blocked actions receive no permit.</desc>
  <rect width="980" height="430" fill="#fbfbfd"/>
  <style>
    .heading{font-size:20px;font-weight:650;fill:#15213b}.subheading{font-size:12px;fill:#667085}.label{font-size:11px;font-weight:650;fill:#667085;letter-spacing:.08em}.title{font-size:14px;font-weight:650;fill:#15213b}.body{font-size:12px;fill:#667085}.small{font-size:11px;fill:#667085}.card{fill:#fff;stroke:#d7dce6;stroke-width:1.3}.gate{fill:#eef3ff;stroke:#6f83d8;stroke-width:1.5}.permit{fill:#eef9f2;stroke:#66a77a;stroke-width:1.5}.deny{fill:#fff5f3;stroke:#de9388;stroke-width:1.3}.consume{fill:#fff8ec;stroke:#dba84b;stroke-width:1.5}.arrow{stroke:#9aa4b2;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.dashed{stroke:#9aa4b2;stroke-width:1.4;stroke-dasharray:5 5;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9aa4b2"/></marker></defs>

  <text x="36" y="40" class="heading">A decision becomes a one-time permit</text>
  <text x="36" y="62" class="subheading">The permit is short-lived and valid only for the exact action that was evaluated.</text>

  <text x="36" y="105" class="label">PROPOSE</text>
  <rect x="36" y="120" width="174" height="116" rx="11" class="card"/>
  <circle cx="123" cy="153" r="15" fill="#f1efff" stroke="#9482d6"/>
  <path d="M116 149h14v10h-14z M120 145h6" fill="none" stroke="#9482d6" stroke-width="1.5"/>
  <text x="123" y="188" class="title" text-anchor="middle">Agent action</text>
  <text x="123" y="208" class="body" text-anchor="middle">Intent · target · inputs</text>

  <path d="M214 178 H266" class="arrow"/>

  <text x="270" y="105" class="label">DECIDE</text>
  <rect x="270" y="120" width="226" height="116" rx="11" class="gate"/>
  <text x="383" y="153" class="title" text-anchor="middle">Authorization gate</text>
  <text x="383" y="179" class="body" text-anchor="middle">Hard policy + semantic evidence</text>
  <text x="383" y="200" class="body" text-anchor="middle">Exact action fingerprint</text>

  <path d="M500 178 H552" class="arrow"/>

  <text x="556" y="105" class="label">PERMIT</text>
  <rect x="556" y="120" width="174" height="116" rx="11" class="permit"/>
  <path d="M625 145h36v25h-36z M631 145v-8a12 12 0 0 1 24 0v8" fill="none" stroke="#66a77a" stroke-width="2"/>
  <text x="643" y="190" class="title" text-anchor="middle">Action Grant</text>
  <text x="643" y="209" class="body" text-anchor="middle">Signed · expiring · exact</text>

  <path d="M734 178 H786" class="arrow"/>

  <text x="790" y="105" class="label">ENFORCE</text>
  <rect x="790" y="120" width="154" height="116" rx="11" class="consume"/>
  <circle cx="867" cy="153" r="15" fill="#dba84b"/>
  <path d="M860 153l5 5 10-11" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="867" y="190" class="title" text-anchor="middle">Consume once</text>
  <text x="867" y="209" class="body" text-anchor="middle">Then run the tool</text>

  <path d="M383 240 V286 H500" class="dashed"/>
  <rect x="500" y="268" width="230" height="64" rx="10" class="deny"/>
  <text x="615" y="294" class="title" text-anchor="middle">REVIEW or BLOCK</text>
  <text x="615" y="314" class="body" text-anchor="middle">No permit is created</text>

  <rect x="36" y="366" width="908" height="40" rx="9" class="card"/>
  <text x="490" y="382" class="title" text-anchor="middle">Changing the tenant, principal, tool, operation, arguments, risk, or policy breaks the binding</text>
  <text x="490" y="398" class="small" text-anchor="middle">Expired, altered, unknown, and already-used permits fail closed.</text>
</svg>
