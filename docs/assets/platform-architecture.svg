      .blue { fill:#eef3ff; stroke:#7b8ee6; stroke-width:1.4 }
      .purple { fill:#f3efff; stroke:#9985dd; stroke-width:1.4 }
      .amber { fill:#fff7e8; stroke:#dda84d; stroke-width:1.4 }
      .green { fill:#ecf9f1; stroke:#67ad80; stroke-width:1.4 }
      .red { fill:#fff1ef; stroke:#db8a7d; stroke-width:1.4 }
      .boundary { fill:#fbfcff; stroke:#7185de; stroke-width:1.5; stroke-dasharray:7 6 }
      .arrow { fill:none; stroke:#7c8aa5; stroke-width:1.8; marker-end:url(#arrow) }
      .line { fill:none; stroke:#a9b3c4; stroke-width:1.4 }
    </style>
