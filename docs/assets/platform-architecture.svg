  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c8aa5"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
