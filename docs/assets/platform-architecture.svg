  <text x="137" y="214" class="title" text-anchor="middle">TypeScript / Python</text>
  <rect x="64" y="247" width="147" height="48" rx="9" class="blue"/>
  <text x="137" y="276" class="title" text-anchor="middle">MCP proxy / gateway</text>
  <rect x="64" y="309" width="147" height="48" rx="9" class="blue"/>
  <text x="137" y="338" class="title" text-anchor="middle">HTTP proxy / sidecar</text>
  <rect x="64" y="371" width="147" height="48" rx="9" class="blue"/>
  <text x="137" y="400" class="adapter" text-anchor="middle">Webhooks / automation</text>
  <text x="137" y="450" class="small" text-anchor="middle">One authorization contract</text>
  <text x="137" y="467" class="small" text-anchor="middle">across every adapter</text>

