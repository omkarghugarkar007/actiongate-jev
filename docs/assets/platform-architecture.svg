<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 958" width="1200" height="958" role="img" aria-labelledby="title description" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <title id="title">ActionGate platform architecture</title>
  <desc id="description">Applications enter through integration adapters. ActionGate authenticates the tenant, resolves server-owned tools and policy, and resolves deterministic facts from trusted deployment services rather than trusting the caller's claims. It combines those facts with Jev evidence from TypeSafe/OpenRouter or experimental Nemotron evidence from NVIDIA/Nebius and issues a single-use exact-action grant. A guarded execution boundary — the SDK wrapper, the embeddable MCP gateway, the standalone MCP and HTTP proxies that hold the downstream credential, or a credential broker that exchanges the grant for a short-lived signed request — consumes the grant before business tools run. Execution outcomes are recorded separately from authorization, and the evidence loop feeds calibration runs whose drift gate blocks a promotion that would raise the unsafe-allow rate. Redis protects short-lived runtime state and PostgreSQL preserves durable control-plane and audit state. Sanitized synthetic demo records feed a separate public static evidence viewer with no permits or executor; optional Nebius capture has a per-batch catalog-priced reservation guard. Optional public research has its own registry-owned query and consumed search permit before a private Tavily executor checks free headroom and reserves credits. Bounded HTTPS sources return only as untrusted planner guidance; the separate refund permit and trusted facts stay independent.</desc>
